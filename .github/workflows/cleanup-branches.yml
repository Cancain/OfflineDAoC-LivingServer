name: Clean up fork branches (one-off)
# One-off (2026-10-18): archive-tags the never-merged branches, then deletes merged and replaced ones.
# Started by hand from the Actions tab. Remove this file afterwards.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Type APPLY to tag and delete. Anything else only shows what would happen."
        default: "show"
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Clean up
        run: bash .github/cleanup-2026-10-18.sh "${{ inputs.mode }}"
